name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: test (py${{ matrix.python-version }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.12", "3.13"]
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip

      - name: Install
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]"

      - name: Lint
        run: ruff check src/ tests/

      - name: Types
        run: mypy src/
        continue-on-error: true

      - name: Tests
        run: pytest -q

  spec-conformance:
    # Separate job so a spec regression is legible at a glance in the PR
    # checks list rather than buried in the full suite's output.
    name: MCP 2026-07-28 conformance
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: pip

      - name: Install
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]"

      - name: Assert the SDK is on the spec-aligned major
        # The 1.x decorator API this server no longer uses was removed in
        # 2.0.0; a resolver that drifts back to 1.x would fail at serve
        # time, not import time, so check it explicitly.
        run: |
          python - <<'PY'
          from importlib.metadata import version
          resolved = version("mcp")
          major = int(resolved.split(".")[0])
          assert major == 2, f"expected mcp 2.x (2026-07-28 spec), got {resolved}"
          print("mcp", resolved)
          PY

      - name: Conformance suite
        run: pytest tests/test_spec_conformance_2026_07_28.py tests/transport/ -q

      - name: Fail on deprecated MCP feature use
        # roots / sampling / logging are deprecated under the 12-month
        # policy. mesa-mcp is a pure tools server and uses none of them;
        # this keeps it that way.
        run: |
          python - <<'PY'
          import pathlib
          import re
          import sys

          # Match SDK call sites, not incidental words: mesa-mcp uses the
          # stdlib `logging` module legitimately, so only the MCP protocol
          # methods are flagged.
          patterns = {
              "sampling/createMessage": r"\bcreate_message\b|sampling/createMessage",
              "roots/list": r"\blist_roots\b|roots/list",
              "logging/setLevel": r"logging/setLevel|\bset_level\b",
          }
          offenders = []
          for path in sorted(pathlib.Path("src").rglob("*.py")):
              text = path.read_text(encoding="utf-8")
              for label, pattern in patterns.items():
                  for match in re.finditer(pattern, text):
                      line = text[: match.start()].count("\n") + 1
                      offenders.append(f"{path}:{line}: deprecated {label}")
          if offenders:
              print("\n".join(offenders))
              sys.exit(
                  "deprecated MCP features are in use — see the 12-month "
                  "deprecation policy"
              )
          print("no deprecated MCP feature use")
          PY

      - name: Surface MCPDeprecationWarning
        # Advisory: the SDK emits these as it retires surfaces. Reported,
        # not enforced, so an SDK bump does not break the build.
        continue-on-error: true
        run: pytest -q -W error::DeprecationWarning tests/test_spec_conformance_2026_07_28.py
