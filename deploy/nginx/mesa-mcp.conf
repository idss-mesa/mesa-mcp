# nginx site config for the mesa-mcp MCP service.
#
# Place at /etc/nginx/sites-available/mesa-mcp and symlink into
# /etc/nginx/sites-enabled/.  Run `sudo nginx -t && sudo systemctl reload nginx`.
#
# Replace `MESA_MCP_HOSTNAME` with the public hostname before enabling.
# Use `sed` or the helper at deploy/install-nginx.sh.
#
# After symlinking, run `sudo certbot --nginx -d MESA_MCP_HOSTNAME` to
# get a Let's Encrypt cert. Certbot rewrites this file in place to add
# the `ssl_certificate*` directives and the HTTP→HTTPS redirect.

# HTTP — used for the certbot challenge and (post-certbot) redirects to HTTPS.
server {
    listen 80;
    listen [::]:80;
    server_name MESA_MCP_HOSTNAME;

    # Health endpoint stays on HTTP so external monitors don't need TLS.
    location = /healthz {
        proxy_pass http://127.0.0.1:8080/healthz;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        access_log off;
    }

    # Certbot rewrites this block on first run to redirect to HTTPS.
    location / {
        return 301 https://$host$request_uri;
    }
}

# HTTPS — the real MCP service.
# Certbot adds the ssl_certificate / ssl_certificate_key lines below
# on first run. Until then, this block won't load — nginx will fail
# config check, which is intentional ("don't expose HTTPS without a cert").
server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name MESA_MCP_HOSTNAME;

    # ssl_certificate     /etc/letsencrypt/live/MESA_MCP_HOSTNAME/fullchain.pem;  # managed by certbot
    # ssl_certificate_key /etc/letsencrypt/live/MESA_MCP_HOSTNAME/privkey.pem;    # managed by certbot
    # include /etc/letsencrypt/options-ssl-nginx.conf;                            # managed by certbot
    # ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem;                              # managed by certbot

    # Modern TLS only.
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_prefer_server_ciphers on;

    # Security headers. HSTS is conservative (1 day) until you're confident.
    add_header Strict-Transport-Security "max-age=86400" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "DENY" always;
    add_header Referrer-Policy "no-referrer" always;

    # mesa-mcp upstream — uvicorn bound to 127.0.0.1:8080 via systemd.
    location / {
        proxy_pass http://127.0.0.1:8080;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Authorization $http_authorization;

        # SSE-friendly settings — long-lived streams, no buffering.
        proxy_buffering off;
        proxy_cache off;
        proxy_read_timeout 86400s;
        proxy_send_timeout 86400s;
        chunked_transfer_encoding on;
    }

    # Health endpoint — duplicate for HTTPS monitors.
    location = /healthz {
        proxy_pass http://127.0.0.1:8080/healthz;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        access_log off;
    }

    # Reasonable request-size cap. MCP requests are small JSON; large
    # uploads should go through ds_upload_file (WebDAV URL minting),
    # not through this proxy.
    client_max_body_size 10m;
}
